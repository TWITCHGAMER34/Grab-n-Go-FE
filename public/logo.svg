<?xml version="1.0" encoding="UTF-8"?>
<svg class="navbar__logo-circle"
     role="img"
     aria-label="G"
     width="40"
     height="40"
     viewBox="0 0 40 40"
     xmlns="http://www.w3.org/2000/svg">
    <title>G</title>

    <defs>
        <linearGradient id="logo-grad" x1="0" y1="1" x2="1" y2="0">
            <stop offset="0%" stop-color="#F3680FFF"/>
            <stop offset="100%" stop-color="#77C566FF"/>
        </linearGradient>

        <filter id="logo-shadow" x="-50%" y="-50%" width="200%" height="200%">
            <feDropShadow dx="0" dy="1" stdDeviation="4" flood-color="#000000" flood-opacity="0.08"/>
        </filter>
    </defs>

    <circle cx="20" cy="20" r="18" fill="url(#logo-grad)" filter="url(#logo-shadow)"/>

    <text x="20" y="21"
          text-anchor="middle"
          dominant-baseline="middle"
          fill="#ffffff"
          font-weight="800"
          font-size="18"
          font-family="Poppins, sans-serif">
        G
    </text>
</svg>
